# Proposes updates for the pinned GitHub Actions only. xrplbak has no Go
# dependencies, so there is nothing else to update. Each proposal is a
# pull request that keeps the commit pin and its version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The CodeQL steps (init, analyze, upload-sarif) must run the same
    # version. One pull request for all of them; apart, the analyze bump
    # alone fails the codeql check.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
