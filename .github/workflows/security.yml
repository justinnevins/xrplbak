name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Third-party scanners. They run here, not in the release build, and they
# add no dependency to the module. Actions are pinned to a commit SHA for
# the reason given in ci.yml. The scanner versions are pinned the same way.
permissions:
  contents: read

jobs:
  # Known vulnerabilities in the Go standard library and toolchain that
  # the code actually reaches. The module has no other dependencies.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: |
          set -o pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -show verbose ./... 2>&1 | tee govulncheck.txt
      # Source mode above runs on the scanner's own toolchain. The release
      # binary is built with the go.mod toolchain, so scan that binary too:
      # binary mode checks the standard library version it was built with.
      - run: |
          set -o pipefail
          make build
          go version bin/xrplbak-linux-amd64 | tee -a govulncheck.txt
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode binary -show verbose bin/xrplbak-linux-amd64 2>&1 | tee -a govulncheck.txt
      - name: Report
        if: always()
        run: |
          body=$(grep -E 'scanned the following|standard library:|^bin/|^Vulnerability #|Found in:|Fixed in:|No vulnerabilities|Your code' govulncheck.txt | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::notice title=govulncheck::${body}"

  # Common unsafe Go patterns. The text report goes to the log and the SARIF
  # report to the repository's code scanning page.
  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.1"
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - run: gosec -no-fail -fmt text ./... | tee gosec.txt
      - run: gosec -no-fail -fmt sarif -out gosec.sarif ./...
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: gosec.sarif
          category: gosec
      - name: Report
        if: always()
        shell: python3 {0}
        env:
          SARIF: gosec.sarif
          TITLE: gosec
        run: |
          import json, os
          lines = []
          try:
              doc = json.load(open(os.environ["SARIF"]))
              for run in doc.get("runs", []):
                  for r in run.get("results", []):
                      loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                      path = loc.get("artifactLocation", {}).get("uri", "-")
                      line = loc.get("region", {}).get("startLine", 0)
                      lines.append("%s %s:%s %s" % (r.get("ruleId"), path, line, r.get("message", {}).get("text", "").splitlines()[0][:300]))
          except Exception as e:
              lines.append("report unreadable: %s" % e)
          body = "%d result(s)\n" % len(lines) + "\n".join(lines)
          body = body.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::notice title=%s::%s" % (os.environ["TITLE"], body))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gosec
          path: |
            gosec.txt
            gosec.sarif

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: go
          queries: security-extended
      - run: make build
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: codeql
          output: codeql-results
      - name: Report
        if: always()
        shell: python3 {0}
        env:
          SARIF: codeql-results/go.sarif
          TITLE: codeql
        run: |
          import json, os
          lines = []
          try:
              doc = json.load(open(os.environ["SARIF"]))
              for run in doc.get("runs", []):
                  for r in run.get("results", []):
                      loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                      path = loc.get("artifactLocation", {}).get("uri", "-")
                      line = loc.get("region", {}).get("startLine", 0)
                      lines.append("%s %s:%s %s" % (r.get("ruleId"), path, line, r.get("message", {}).get("text", "").splitlines()[0][:300]))
          except Exception as e:
              lines.append("report unreadable: %s" % e)
          body = "%d result(s)\n" % len(lines) + "\n".join(lines)
          body = body.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::notice title=%s::%s" % (os.environ["TITLE"], body))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql
          path: codeql-results

  # Repository practices: pinned actions, token permissions, branch
  # protection, signed releases. Results are not published to the
  # OpenSSF API.
  scorecard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
      - name: Report
        if: always()
        shell: python3 {0}
        env:
          SARIF: scorecard.sarif
          TITLE: scorecard
        run: |
          import json, os
          lines = []
          try:
              doc = json.load(open(os.environ["SARIF"]))
              for run in doc.get("runs", []):
                  for r in run.get("results", []):
                      loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                      path = loc.get("artifactLocation", {}).get("uri", "-")
                      line = loc.get("region", {}).get("startLine", 0)
                      lines.append("%s %s:%s %s" % (r.get("ruleId"), path, line, r.get("message", {}).get("text", "").splitlines()[0][:300]))
          except Exception as e:
              lines.append("report unreadable: %s" % e)
          body = "%d result(s)\n" % len(lines) + "\n".join(lines)
          body = body.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::notice title=%s::%s" % (os.environ["TITLE"], body))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard
          path: scorecard.sarif
