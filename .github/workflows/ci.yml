name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Actions are pinned to a commit SHA, not a moving tag. A tag can be
# repointed by the action's owner or by anyone who compromises that
# account; a SHA cannot. Re-pin deliberately, with the version comment
# updated in the same commit.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make checksums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: bin/

  # Short fuzz smoke on every push. The targets carry a committed corpus, so
  # this replays every counterexample found so far and then explores briefly.
  # Long campaigns run out of band, not here.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./internal/cfg
            target: FuzzCanonicalIsFixedPoint
          - pkg: ./internal/redact
            target: FuzzSplitMergeRoundTrip
          - pkg: ./internal/redact
            target: FuzzOnChainIsClean
          - pkg: ./internal/container
            target: FuzzPackUnpackRoundTrip
          - pkg: ./internal/container
            target: FuzzDecodeNoPanic
          - pkg: ./internal/chunk
            target: FuzzEncodeDecodeRoundTrip
          - pkg: ./internal/crypto
            target: FuzzBundleRoundTrip
          - pkg: ./internal/anchor
            target: FuzzForgedMACIsRejected
          - pkg: ./internal/restore
            target: FuzzCheckPathContract
          - pkg: ./internal/restore
            target: FuzzAcceptedPathStaysInsideRoot
          - pkg: ./internal/restore
            target: FuzzBuildNoPanic
          - pkg: ./internal/dump
            target: FuzzLoadNoPanic
          - pkg: ./internal/dump
            target: FuzzLoadRefusesAmbiguousHashes
          - pkg: ./internal/xrpl/rpc
            target: FuzzResponseParsingNoPanic
          - pkg: ./internal/xrpl/rpc
            target: FuzzErrorResultIsNeverSuccess
          - pkg: ./internal/xrpl/rpc
            target: FuzzServerInfoRefusesEmptyAnswer
          - pkg: ./internal/xrpl/rpc
            target: FuzzFeeIsBounded
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test ${{ matrix.pkg }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 40s
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-counterexample-${{ matrix.target }}
          path: internal/**/testdata/fuzz/**

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries
          path: bin
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            bin/xrplbak-linux-amd64
            bin/xrplbak-darwin-arm64
            bin/SHA256SUMS
