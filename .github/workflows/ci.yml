name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Actions are pinned to a commit SHA, not a moving tag. A tag can be
# repointed by the action's owner or by anyone who compromises that
# account; a SHA cannot. Re-pin deliberately, with the version comment
# updated in the same commit.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make checksums
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: bin/

  # Short fuzz smoke on every push. The targets carry a committed corpus, so
  # this replays every counterexample found so far and then explores briefly.
  # Long campaigns run out of band, not here.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./internal/cfg
            target: FuzzCanonicalIsFixedPoint
          - pkg: ./internal/cfg
            target: FuzzRippledReadingSurvivesCanonical
          - pkg: ./internal/cfg
            target: FuzzParseRenderIsExact
          - pkg: ./internal/redact
            target: FuzzSplitMergeRoundTrip
          - pkg: ./internal/redact
            target: FuzzOnChainIsClean
          - pkg: ./internal/redact
            target: FuzzBundlelessRestoreStillParses
          - pkg: ./internal/redact
            target: FuzzOnChainScannersRunOnComments
          - pkg: ./internal/container
            target: FuzzPackUnpackRoundTrip
          - pkg: ./internal/container
            target: FuzzDecodeNoPanic
          - pkg: ./internal/chunk
            target: FuzzEncodeDecodeRoundTrip
          - pkg: ./internal/crypto
            target: FuzzBundleRoundTrip
          - pkg: ./internal/anchor
            target: FuzzForgedMACIsRejected
          - pkg: ./internal/restore
            target: FuzzCheckPathContract
          - pkg: ./internal/restore
            target: FuzzAcceptedPathStaysInsideRoot
          - pkg: ./internal/restore
            target: FuzzBuildNoPanic
          - pkg: ./internal/dump
            target: FuzzLoadNoPanic
          - pkg: ./internal/dump
            target: FuzzLoadRefusesAmbiguousHashes
          - pkg: ./internal/xrpl/rpc
            target: FuzzResponseParsingNoPanic
          - pkg: ./internal/xrpl/rpc
            target: FuzzErrorResultIsNeverSuccess
          - pkg: ./internal/xrpl/rpc
            target: FuzzServerInfoRefusesEmptyAnswer
          - pkg: ./internal/xrpl/rpc
            target: FuzzFeeIsBounded
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ${{ matrix.pkg }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 40s
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-counterexample-${{ matrix.target }}
          path: internal/**/testdata/fuzz/**

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: bin
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            bin/xrplbak-linux-amd64
            bin/xrplbak-darwin-arm64
            bin/SHA256SUMS
